server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/synap-pharma-web/dist;
    index index.html;

    # O "try_files" garante que o React Router funcione perfeitamente 
    # ao aceder a /pagar ou /admin diretamente pelo navegador
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache otimizado para os ficheiros estáticos gerados pelo Vite/React
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}